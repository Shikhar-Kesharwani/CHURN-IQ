[pytest]
# ML validation suite (CHURN-13..17). The older script-style tests
# (test_api_endpoints.py, test_similarity_engine.py) are run directly with
# `python <file>`; test_similarity_engine.py rewrites the committed .joblib
# artifacts, so it is deliberately not auto-collected here.
testpaths = tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
