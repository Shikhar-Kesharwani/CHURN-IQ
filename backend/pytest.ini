[pytest]
# Full backend suite: ML validation (CHURN-13..17, 37, 38) in tests/, API
# quality tests (CHURN-18..25) in tests/test_api_*.py, tests/test_retention_gemini.py,
# tests/test_similarity_api.py, tests/test_whatif_api.py, plus the two original
# script-style tests. test_similarity_engine.py now writes its artifacts to a
# temporary directory (CHURN-25), so it is safe to collect; both scripts can
# still be run directly with `python <file>`.
testpaths = tests test_api_endpoints.py test_similarity_engine.py
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
