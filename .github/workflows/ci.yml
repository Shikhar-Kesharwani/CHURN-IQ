name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    # Pinned: actions/setup-python has no Python 3.10.13 build for the newer
    # ubuntu-latest image (26.04); 24.04 has one (CHURN-46).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same Python as production (backend/runtime.txt: python-3.10.13), so the
      # suite tests the runtime that is actually deployed. requirements-dev.txt
      # pins matplotlib 3.10.x for this; matplotlib 3.11+ needs Python >= 3.11
      # (CHURN-46). Keep this in step with runtime.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Component and API-client tests (vitest + jsdom). Kept inside this job so the
      # required status check name ("Frontend build") does not change.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
