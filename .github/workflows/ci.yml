name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    # Pinned: actions/setup-python has no Python 3.10.13 build for the newer
    # ubuntu-latest image (26.04); 24.04 has one (CHURN-46).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same Python as production (backend/runtime.txt: python-3.10.13), so the
      # suite tests the runtime that is actually deployed. requirements-dev.txt
      # pins matplotlib 3.10.x for this; matplotlib 3.11+ needs Python >= 3.11
      # (CHURN-46). Keep this in step with runtime.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Component and API-client tests (vitest + jsdom). Kept inside this job so the
      # required status check name ("Frontend build") does not change.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # CHURN-55: end-to-end smoke tests in a real browser against a real uvicorn
  # backend (frontend/e2e, frontend/playwright.config.js). A separate job, so the
  # names of the two required checks above do not change. The fixture/API
  # contract check (backend/tests/test_frontend_fixture_contracts.py) runs in
  # "Backend tests". No Gemini key or email configuration is used.
  browser-smoke-tests:
    name: Browser smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
